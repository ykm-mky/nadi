<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090b">
  <meta name="description" content="Our journey begins in Antalya.">
  <title>Our Journey — Nathalie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink: #f5eee4; --muted: #a8a19b; --gold: #d7b98d; --bg: #07090b; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: 'DM Sans', sans-serif; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
    [hidden] { display: none !important; }
    .stage { position: absolute; inset: 0; min-height: 100vh; min-height: 100dvh; transition: opacity 1.1s cubic-bezier(.22,1,.36,1), visibility 1.1s; }
    .stage:not(.active) { opacity: 0; visibility: hidden; pointer-events: none; }
    .stage.active { opacity: 1; visibility: visible; }
    .intro { display: grid; place-items: center; padding: 25px; text-align: center; background: #050607; }
    .intro::before { content: ''; position: absolute; width: min(680px,80vw); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle,rgba(165,124,77,.08),transparent 68%); pointer-events: none; }
    .intro-message { position: relative; max-width: 840px; margin: 0; font: italic 500 clamp(34px,6.8vw,76px)/1.13 'Cormorant Garamond', Georgia, serif; letter-spacing: -.018em; }
    .intro-message span { display: block; opacity: 0; transform: translateY(15px); animation: line-enter 1.25s cubic-bezier(.2,1,.2,1) forwards; }
    .intro-message span:nth-child(2) { animation-delay: .65s; }
    .intro-message span:nth-child(3) { animation-delay: 1.35s; color: var(--gold); font-size: 1.19em; }
    @keyframes line-enter { to { opacity: 1; transform: translateY(0); } }
    .map-stage { display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; padding: 0 18px; background: radial-gradient(ellipse at 50% 49%,#111518 0%,#090b0d 58%,#050607 100%); }
    .map-stage::before { content: ''; position: absolute; inset: 0; opacity: .22; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence baseFrequency='.62' numOctaves='2' type='fractalNoise' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)' opacity='.16'/%3E%3C/svg%3E"); }
    .map-wrap {
      position: relative; width: min(100%, 1100px); max-height: min(80vh,720px); flex: 0 1 auto;
      transform: translate(0, 0) scale(1);
      transition: transform 2.15s cubic-bezier(.33,.05,.62,1);
      will-change: transform;
    }
    .map-stage.zoom-in .map-wrap {
      transform: translate(var(--shift-x, 0px), var(--shift-y, 0px)) scale(4.6);
    }
    .map-svg { display: block; width: 100%; max-height: min(70vh,670px); margin: auto; overflow: visible; }
    .land { fill: #181e23; stroke: #3b4247; stroke-width: .9; vector-effect: non-scaling-stroke; }
    .focus-land { fill: #282c30; stroke: #66635b; stroke-width: 1.3; vector-effect: non-scaling-stroke; }
    .map-grid line { stroke: #8b8680; stroke-width: .65; opacity: .10; vector-effect: non-scaling-stroke; }
    .route-shadow { stroke: rgba(222,185,134,.08); stroke-width: 15; stroke-linecap: round; fill: none; }
    .route-line { fill: none; stroke: #e8c18a; stroke-width: 2.8; stroke-linecap: round; filter: url(#routeGlow); }
    .route-dots { fill: none; stroke: #cba777; stroke-width: 1.2; stroke-dasharray: 2 11; opacity: .42; }
    .location-dot { fill: #ffefcd; stroke: #d7b98d; stroke-width: 4; }
    .destination-halo { fill: none; stroke: #e6bb7e; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .arrived .destination-halo { animation: halo 1.65s ease-out 2; }
    @keyframes halo { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.7); } }
    .plane-body { fill: #f6e7ca; stroke: #9f784a; stroke-width: .7; filter: url(#planeGlow); }
    .flight-plane { opacity: 0; }
    /* The video becomes the entire cinematic frame, with no decorative border. */
    .video-stage {
      z-index: 4;
      display: grid; place-items: stretch; overflow: hidden;
      width: 100vw; height: 100vh; height: 100dvh;
      padding: 0; background: #020304;
      clip-path: circle(0px at var(--arrival-x, 70%) var(--arrival-y, 60%));
      transition: clip-path 1.65s cubic-bezier(.22,1,.36,1), opacity .65s ease, visibility .65s;
    }
    .video-stage.revealed {
      clip-path: circle(160vmax at var(--arrival-x, 70%) var(--arrival-y, 60%));
    }
    .video-stage video {
      display: block; position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      background: #030407;
    }
    .video-vignette {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.24), transparent 33%,
                       transparent 60%, rgba(0,0,0,.19));
      opacity: 0; transition: opacity 1.2s ease;
    }
    .video-stage.revealed .video-vignette { opacity: 1; }
    .video-title {
      position: absolute; top: 50%; left: 50%; z-index: 2;
      width: min(86vw, 940px); margin: 0; transform: translate(-50%, -39%);
      color: #fff7eb; text-align: center;
      font: italic 500 clamp(33px, 5.7vw, 74px)/1.12 'Cormorant Garamond', Georgia, serif;
      letter-spacing: -.018em;
      text-shadow: 0 3px 30px rgba(0,0,0,.9), 0 1px 7px rgba(0,0,0,.7);
      opacity: 0; transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.22,1,.36,1);
      pointer-events: none;
    }
    .video-stage.show-title .video-title { opacity: 1; transform: translate(-50%, -50%); }
    .video-stage.hide-title .video-title { opacity: 0; transform: translate(-50%, -57%); }
    .video-play-fallback {
      position: absolute; left: 50%; bottom: 38px; z-index: 4;
      transform: translateX(-50%); width: 56px; height: 56px;
      border: 1px solid rgba(255,240,211,.75); border-radius: 50%;
      background: rgba(12,14,17,.64); color: white; cursor: pointer;
      display: grid; place-items: center; backdrop-filter: blur(12px);
    }
    .video-play-fallback svg { width: 22px; height: 22px; fill: currentColor; }
    .video-continue-fallback {
      position:absolute; left:50%; bottom:106px; transform:translateX(-50%);
      z-index:8; border:1px solid rgba(246,226,197,.6); border-radius:3px;
      padding:11px 18px; color:#f7ebdb; background:rgba(9,12,14,.76);
      backdrop-filter:blur(10px); font:500 10px/1.4 'DM Sans',sans-serif;
      letter-spacing:.17em; text-transform:uppercase; white-space:nowrap; cursor:pointer;
    }

    /* Second chapter: a quiet title card followed by a cinematic iris reveal. */
    .home-intro { z-index: 3; }
    .home-intro .intro-message span {
      opacity: 0;
      transform: translateY(18px);
      animation: none;
    }
    .home-intro.active .intro-message span {
      animation: line-enter 1.1s cubic-bezier(.2,1,.2,1) forwards;
    }
    .home-intro.active .intro-message span:nth-child(2) { animation-delay: .68s; }
    .home-intro.active .intro-message span:nth-child(3) { animation-delay: 1.42s; }
    .home-video-stage {
      z-index: 6;
      clip-path: inset(48.8% 47% round 22px);
      transition: clip-path 1.85s cubic-bezier(.19,1,.22,1), opacity .8s ease, visibility .8s;
    }
    .home-video-stage.revealed { clip-path: inset(0 0 0 0 round 0px); }
    .home-video-stage video {
      filter: brightness(.65) saturate(.78) blur(10px);
      transform: scale(1.08);
      transition: filter 1.9s ease, transform 1.9s cubic-bezier(.22,1,.36,1);
    }
    .home-video-stage.revealed video {
      filter: none;
      transform: scale(1);
    }
    .home-video-stage .video-play-fallback { z-index: 7; }
    /* Bridge two HTML pages through the same dark frame; no hard video cut. */
    .chapter-fade {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #050506;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1.8s ease-in-out, visibility 1.8s;
    }
    .chapter-fade.active { opacity: 1; visibility: visible; }

    @media (max-width: 600px) {
      .video-title { width: min(88vw, 540px); font-size: clamp(33px, 9.2vw, 51px); }
      .video-play-fallback { bottom: 30px; }
    }
    @media (max-width: 600px) {
      .map-stage { padding: 0; }
          .map-wrap { width: 100vw; }
      .map-svg { width: 100%; max-height: 60vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .intro-message span { opacity: 1; transform: none; }
      .video-stage.active { clip-path: none; }
    }
  </style>
  <script>
    // Only direct GitHub Pages visits are redirected; iframe chapters work normally.
    if (window.top === window.self && location.hostname.endsWith('.github.io')) {
      location.replace('./');
    }
  </script>
</head>

    <section class="stage video-stage" id="videoScene" aria-label="Little Nadi by the sea" aria-hidden="true">
      <video id="memoryVideo" src="antalya.mp4" controls muted playsinline preload="auto" aria-label="Nadi enjoying the sea"></video>
      <div class="video-vignette" aria-hidden="true"></div>
      <p class="video-title">While little Nadi was enjoying the sea…</p>
      <button class="video-play-fallback" id="playFallback" type="button" aria-label="Play video" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8v12.4a.8.8 0 0 0 1.23.68l9.66-6.2a.8.8 0 0 0 0-1.36L9.23 5.12A.8.8 0 0 0 8 5.8Z"/></svg>
      </button>
      <button class="video-continue-fallback" id="continueAntalya" type="button" hidden>Continue story</button>
    </section>

    <section class="stage intro home-intro" id="homeIntroScene" aria-label="A glimpse of little Nadi at home" aria-hidden="true">
      <h2 class="intro-message">
        <span>And what was our birthday girl, Nadi,</span>
        <span>like at home, back in the day?</span>
        <span>Let's take a peek…</span>
      </h2>
    </section>

    <section class="stage video-stage home-video-stage" id="homeVideoScene" aria-label="Little Nadi at home" aria-hidden="true">
      <video id="homeVideo" src="home.mp4" controls playsinline preload="auto" aria-label="Nadi at home"></video>
      <div class="video-vignette" aria-hidden="true"></div>
      <button class="video-play-fallback" id="homePlayFallback" type="button" aria-label="Play home video" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8v12.4a.8.8 0 0 0 1.23.68l9.66-6.2a.8.8 0 0 0 0-1.36L9.23 5.12A.8.8 0 0 0 8 5.8Z"/></svg>
      </button>
      <button class="video-continue-fallback" id="continueHome" type="button" hidden>Continue story</button>
    </section>
  </main>
  <div class="chapter-fade" id="chapterFade" aria-hidden="true"></div>
  <script>
    const scenes = {
      intro: document.getElementById('introScene'),
      map: document.getElementById('mapScene'),
      video: document.getElementById('videoScene'),
      homeIntro: document.getElementById('homeIntroScene'),
      homeVideo: document.getElementById('homeVideoScene')
    };
    const map = document.getElementById('flightMap');
    const routeLine = document.getElementById('routeLine');
    const routeShadow = document.getElementById('routeShadow');
    const routeDots = document.getElementById('routeDots');
    const plane = document.getElementById('plane');
    const video = document.getElementById('memoryVideo');
    const playFallback = document.getElementById('playFallback');
    const homeVideo = document.getElementById('homeVideo');
    const homePlayFallback = document.getElementById('homePlayFallback');
    const continueAntalya = document.getElementById('continueAntalya');
    const continueHome = document.getElementById('continueHome');
    // A stalled video must never trap the visitor in the journey chapter.
    function monitorVideo(el, playButton, continueButton) {
      let timer = 0;
      const hide = () => {
        clearTimeout(timer);
        playButton.hidden = true;
        continueButton.hidden = true;
      };
      const showChoices = () => {
        if (!el.ended && (el.paused || el.readyState < 3 || el.error)) {
          playButton.hidden = false;
          continueButton.hidden = false;
        }
      };
      const arm = () => {
        clearTimeout(timer);
        timer = setTimeout(showChoices, 5000);
      };
      el.addEventListener('playing', hide);
      el.addEventListener('waiting', arm);
      el.addEventListener('stalled', arm);
      el.addEventListener('error', showChoices);
      return { arm, showChoices };
    }
    const antalyaPlayback = monitorVideo(video, playFallback, continueAntalya);
    const homePlayback = monitorVideo(homeVideo, homePlayFallback, continueHome);

    const chapterFade = document.getElementById('chapterFade');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let timeouts = [];
    let animationFrame = null;
    let sequence = 0;
    const routeLength = routeLine.getTotalLength();

    function schedule(fn, delay) { const id = window.setTimeout(fn, delay); timeouts.push(id); }
    function cancelSequence() {
      sequence++;
      timeouts.forEach(window.clearTimeout);
      timeouts = [];
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
    function show(name) {
      for (const [key, element] of Object.entries(scenes)) {
        const active = key === name;
        element.classList.toggle('active', active);
        element.setAttribute('aria-hidden', String(!active));
      }
    }
    async function startPlayback() {
      playFallback.hidden = true;
      continueAntalya.hidden = true;
      antalyaPlayback.arm();
      video.currentTime = 0;
      // antalya.mp4 is silent; muted autoplay avoids browser gesture restrictions.
      video.muted = true;
      try {
        await video.play();
      } catch (error) {
        antalyaPlayback.showChoices();
      }
    }
    function revealVideo() {
      const point = document.querySelector('.destination-halo').getBoundingClientRect();
      const x = point.left + point.width / 2;
      const y = point.top + point.height / 2;
      scenes.video.style.setProperty('--arrival-x', `${x}px`);
      scenes.video.style.setProperty('--arrival-y', `${y}px`);
      // Keep the map visible as the new scene expands from Antalya.
      scenes.video.classList.add('active');
      scenes.video.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        scenes.video.classList.add('revealed');
        schedule(() => scenes.video.classList.add('show-title'), reducedMotion ? 0 : 540);
        schedule(() => {
          scenes.video.classList.remove('show-title');
          scenes.video.classList.add('hide-title');
        }, reducedMotion ? 4300 : 4800);
      }));
      schedule(() => {
        scenes.map.classList.remove('active');
        scenes.map.setAttribute('aria-hidden', 'true');
      }, reducedMotion ? 100 : 1800);
      startPlayback();
    }
    playFallback.addEventListener('click', () => {
      video.muted = true;
      video.play().then(() => {
        playFallback.hidden = true;
        continueAntalya.hidden = true;
      }).catch(() => { continueAntalya.hidden = false; });
    });
    continueAntalya.addEventListener('click', startHomeChapter);
    function zoomToAntalya() {
      const target = document.querySelector('.location-dot[cx="841.8"]');
      const marker = target.getBoundingClientRect();
      const centerX = marker.left + marker.width / 2;
      const centerY = marker.top + marker.height / 2;
      const wrapRect = document.querySelector('.map-wrap').getBoundingClientRect();
      const wrap = document.querySelector('.map-wrap');
      wrap.style.transformOrigin = `${centerX - wrapRect.left}px ${centerY - wrapRect.top}px`;
      wrap.style.setProperty('--shift-x', `${window.innerWidth / 2 - centerX}px`);
      wrap.style.setProperty('--shift-y', `${window.innerHeight / 2 - centerY}px`);
      scenes.map.classList.add('zoom-in');
      schedule(revealVideo, reducedMotion ? 100 : 1510);
    }
    function resetMap() {
      scenes.map.classList.remove('arrived', 'zoom-in');
      for (const el of [routeLine, routeShadow, routeDots]) {
        el.style.strokeDasharray = String(routeLength);
        el.style.strokeDashoffset = String(routeLength);
      }
      plane.style.opacity = '0';
      plane.setAttribute('transform', `translate(417.7 202.2) rotate(0)`);
    }
    function arrive() {
      routeLine.style.strokeDashoffset = '0';
      routeShadow.style.strokeDashoffset = '0';
      routeDots.style.strokeDashoffset = '0';
      scenes.map.classList.add('arrived');
      schedule(zoomToAntalya, reducedMotion ? 70 : 950);
    }
    function animateFlight(mySequence) {
      if (reducedMotion) { arrive(); return; }
      const duration = 5300;
      const start = performance.now();
      plane.style.opacity = '1';
      function frame(now) {
        if (sequence !== mySequence) return;
        const t = Math.min((now-start)/duration,1);
        const p = t < .5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
        const distance = routeLength * p;
        for (const el of [routeLine, routeShadow, routeDots]) el.style.strokeDashoffset = String(routeLength - distance);
        const here = routeLine.getPointAtLength(distance);
        const ahead = routeLine.getPointAtLength(Math.min(routeLength, distance+3));
        const angle = Math.atan2(ahead.y-here.y, ahead.x-here.x)*180/Math.PI;
        plane.setAttribute('transform', `translate(${here.x} ${here.y}) rotate(${angle})`);
        if (t < 1) animationFrame = requestAnimationFrame(frame);
        else arrive();
      }
      animationFrame = requestAnimationFrame(frame);
    }
    function startJourney() {
      cancelSequence();
      const mySequence = sequence;
      resetMap();
      show('intro');
      schedule(() => {
        if (mySequence !== sequence) return;
        show('map');
        schedule(() => animateFlight(mySequence), reducedMotion ? 100 : 1350);
      }, reducedMotion ? 1600 : 3800);
    }
    // When the Antalya memory finishes, introduce the next childhood memory.
    // No additional button or explanatory copy interrupts the story.
    function startHomeChapter() {
      cancelSequence();
      video.pause();
      show('homeIntro');
      schedule(revealHomeVideo, reducedMotion ? 1600 : 4700);
    }

    function revealHomeVideo() {
      scenes.homeVideo.classList.add('active');
      scenes.homeVideo.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        scenes.homeVideo.classList.add('revealed');
      }));
      schedule(() => {
        scenes.homeIntro.classList.remove('active');
        scenes.homeIntro.setAttribute('aria-hidden', 'true');
      }, reducedMotion ? 100 : 2000);
      playHomeVideo();
    }

    async function playHomeVideo() {
      homePlayFallback.hidden = true;
      continueHome.hidden = true;
      homePlayback.arm();
      homeVideo.currentTime = 0;
      homeVideo.muted = false;
      try {
        await homeVideo.play();
      } catch (error) {
        homeVideo.muted = true;
        try {
          await homeVideo.play();
        } catch (errorAgain) {
          homePlayback.showChoices();
        }
      }
    }

    homePlayFallback.addEventListener('click', () => {
      homeVideo.muted = false;
      homeVideo.play().then(() => {
        homePlayFallback.hidden = true;
        continueHome.hidden = true;
      }).catch(() => { continueHome.hidden = false; });
    });
    video.addEventListener('ended', startHomeChapter);
    // Finish the home memory with a soft fade to black before changing pages.
    let chapterExitStarted = false;
    function finishHomeChapter() {
      if (chapterExitStarted) return;
      chapterExitStarted = true;
      homeVideo.controls = false;
      homePlayFallback.hidden = true;
      chapterFade.classList.add('active');
      window.parent.postMessage({nadiStory:true,action:'anticipate',page:'meeting.html'}, '*');
      window.setTimeout(() => { window.location.assign('meeting.html'); }, reducedMotion ? 160 : 1950);
    }
    homeVideo.addEventListener('ended', finishHomeChapter);
    continueHome.addEventListener('click', finishHomeChapter);

    if (window.innerWidth < 650) map.setAttribute('viewBox','170 40 780 590');
    startJourney();
  </script>
  <script>
    // Music controls stay in index.html, so the soundtrack can survive chapter changes.
    (() => {
      if (window.parent === window) return;
      const send = (action, extra={}) => {
        try { window.parent.postMessage({nadiStory:true, action, ...extra}, '*'); } catch (_) {}
      };
      const page = location.pathname.split('/').pop();
      send('ready', {page});
      document.addEventListener('click', e => {
        if (e.target.closest('#openEnvelope, #tapLabel')) send('open-letter');
      }, true);
      for (const action of ['play','pause','ended','volumechange']) {
        document.addEventListener(action, e => {
          if (e.target.tagName === 'VIDEO') {
            const v = e.target;
            send('video', {event:action, videoId:v.id, audible:!v.muted && v.volume>0});
          }
        }, true);
      }
    })();
  </script>
