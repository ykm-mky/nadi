<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10100f">
  <meta name="description" content="A few cool photos — a private gallery of our favourite moments.">
  <title>A Few Cool Photos — Nathalie & Kerem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme:dark;
      --ease: cubic-bezier(.22,.95,.27,1);
      --ivory:#f4e6d4;
      --gold:#d6bb8b;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100f0e}
    body{font-family:'DM Sans',Arial,sans-serif;color:var(--ivory);-webkit-tap-highlight-color:transparent}
    button{font:inherit}
    button:focus-visible{outline:2px solid #f8d9a6;outline-offset:5px}
    .experience{position:fixed;inset:0;background:#0c0b0a;overflow:hidden;isolation:isolate}
    .experience::after{content:'';position:absolute;inset:0;z-index:36;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 170 170' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.33' filter='url(%23g)'/%3E%3C/svg%3E")}

    /* A deliberately restrained opening: the gallery does all the talking. */
    .chapter-intro{position:absolute;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 48%,#27211d 0%,#141312 50%,#08090a 100%);transition:opacity 1.65s ease,visibility 1.65s}
    .chapter-intro.leave{opacity:0;visibility:hidden;pointer-events:none}
    .intro-copy{max-width:920px}
    .intro-copy p{margin:0;color:#d6c4ad;font:italic 500 clamp(32px,6vw,78px)/1.07 'Cormorant Garamond',Georgia,serif;letter-spacing:-.018em;opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.25s var(--ease)}
    .intro-copy .first{color:#e8d9c5;transition-delay:.12s}
    .intro-copy .second{margin-top:14px;transition-delay:1.3s}
    .intro-copy .last{margin-top:30px;color:#dcb889;font-size:clamp(40px,6.8vw,88px);transition-delay:2.35s}
    .chapter-intro.reveal p{opacity:1;transform:none}

    .room{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 52% 49%,#2b2824 0%,#191716 58%,#0b0b0a 100%);opacity:0;visibility:hidden;transition:opacity 1.8s ease,visibility 1.8s}
    .room.visible{opacity:1;visibility:visible}
    .room::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 170px 45px rgba(2,2,2,.75)}
    .room::after{content:'';position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 30%,rgba(3,3,3,.25) 66%,rgba(0,0,0,.68) 100%)}

    /* The entire wall is a single physical surface, moved by a virtual camera. */
    .world{width:3200px;height:1140px;position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;will-change:transform;background:
      radial-gradient(ellipse at 23% 20%,rgba(167,140,100,.15),transparent 29%),
      radial-gradient(ellipse at 83% 30%,rgba(131,106,80,.13),transparent 37%),
      linear-gradient(165deg,#3d3933 0%,#38332d 40%,#2a2623 100%);
      box-shadow:inset 0 90px 130px rgba(10,8,7,.32),inset 0 -100px 150px rgba(9,8,7,.30),0 45px 100px rgba(0,0,0,.6);
      transition:transform 2600ms var(--ease);
    }
    .world::before{content:'';position:absolute;inset:0 0 180px;pointer-events:none;z-index:1;opacity:.33;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.4' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23p)' opacity='.72'/%3E%3C/svg%3E")}
    .world::after{content:'';position:absolute;inset:0 0 168px;z-index:1;pointer-events:none;opacity:.19;background:repeating-linear-gradient(90deg,transparent 0 420px,rgba(0,0,0,.15) 422px 425px,rgba(255,232,189,.04) 427px,transparent 432px)}
    .cornice{position:absolute;left:0;right:0;top:88px;height:13px;z-index:6;background:linear-gradient(#8a7864 0%,#514539 12%,#3b3026 43%,#28201c 82%,#745e49);box-shadow:0 8px 9px #100d0a55,inset 0 1px #c0aa885c}
    .picture-rail{position:absolute;left:0;right:0;top:178px;height:4px;z-index:2;background:linear-gradient(#735a41,#27211c 75%);box-shadow:0 3px 7px rgba(0,0,0,.34)}
    .baseboard{position:absolute;left:0;right:0;top:968px;height:34px;z-index:7;background:linear-gradient(#75634c 0%,#342920 18%,#1f1916 66%,#564738 99%);box-shadow:0 -10px 23px rgba(0,0,0,.28),0 9px 13px rgba(0,0,0,.43)}
    .floor{position:absolute;left:-5%;right:-5%;top:1000px;height:240px;z-index:2;background:linear-gradient(180deg,#201916 0%,#15110f 45%,#070706 100%)}
    .floor::before{content:'';position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(98deg,transparent 0 200px,#d0b89419 201px 203px,transparent 205px 370px)}
    .sconce{position:absolute;z-index:8;top:350px;width:38px;height:120px;border-radius:14px 14px 9px 9px;border:2px solid #a58a66;background:linear-gradient(90deg,#1f1712 0%,#8a6e4d 43%,#211b17 100%);box-shadow:0 0 14px #e9b9671a,0 12px 20px rgba(0,0,0,.5)}
    .sconce::before{content:'';position:absolute;top:-18px;left:9px;width:15px;height:58px;border-radius:14px;background:linear-gradient(90deg,#e4ca8c,#fff4ce 60%,#9d7142);box-shadow:0 0 18px rgba(250,211,134,.48),0 0 70px 24px rgba(255,215,128,.09)}
    .sconce.left{left:70px}.sconce.right{right:70px}
    .pool{position:absolute;z-index:2;pointer-events:none;top:127px;width:610px;height:750px;transform:translateX(-50%);opacity:.53;background:radial-gradient(ellipse at 50% 16%,rgba(240,203,140,.18),rgba(226,181,112,.07) 34%,transparent 71%);mix-blend-mode:screen}
    .lamp{position:absolute;top:144px;z-index:5;width:20px;height:10px;border:1px solid #bd9b69;border-radius:2px 2px 6px 6px;background:linear-gradient(180deg,#504333,#1e1a17);box-shadow:0 3px 9px rgba(0,0,0,.33)}
    .lamp::after{content:'';position:absolute;top:8px;left:4px;width:10px;height:3px;border-radius:50%;background:#edd6a6;box-shadow:0 0 12px #e2b67c6b}

    .art-frame{position:absolute;z-index:9;display:block;appearance:none;border:0;cursor:pointer;padding:14px;margin:0;text-align:left;overflow:visible;color:inherit;background:
      linear-gradient(145deg,rgba(255,242,198,.48),transparent 11%,transparent 86%,rgba(255,235,179,.24)),
      linear-gradient(127deg,#1b120c 0%,#665137 3%,#c39b59 8%,#705033 12%,#2d221a 17%,#1c1814 52%,#8e653a 88%,#d7ae6e 93%,#2b1d13 100%);
      box-shadow:inset 0 0 0 1px rgba(255,232,168,.27),inset 0 0 0 4px rgba(33,24,16,.65),inset 0 0 0 8px rgba(194,150,92,.31),0 7px 0 #1c140e,7px 15px 15px rgba(6,5,4,.55),18px 25px 40px rgba(7,5,4,.48);
      transition:filter 1s ease,box-shadow 1.1s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .art-frame::before{content:'';position:absolute;inset:5px;pointer-events:none;border:1px solid rgba(250,222,165,.48);box-shadow:inset 0 0 0 3px rgba(12,10,8,.46),0 0 0 1px rgba(16,12,10,.6);z-index:5}
    .art-frame::after{content:'';position:absolute;inset:14px;pointer-events:none;z-index:6;opacity:.18;background:linear-gradient(118deg,rgba(255,255,255,.4) 0%,transparent 15%,transparent 64%,rgba(250,235,196,.10) 77%,transparent 100%)}
    .mat{display:block;position:relative;width:100%;height:100%;padding:12px;background:linear-gradient(135deg,#f2e9d7 0%,#dcd2bd 57%,#f0e5d2 100%);box-shadow:inset 2px 3px 10px rgba(61,50,38,.38),inset -1px -1px 2px rgba(255,255,255,.65)}
    .mat::after{content:'';position:absolute;inset:12px;box-shadow:inset 0 0 0 2px rgba(38,29,23,.48),inset 0 0 11px rgba(0,0,0,.28);pointer-events:none;z-index:3}
    .mat img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#1b1714;filter:saturate(.89) contrast(1.01);-webkit-user-drag:none;user-select:none;transition:filter 1s ease}
    .art-frame.current{z-index:15;box-shadow:inset 0 0 0 1px rgba(255,232,168,.3),inset 0 0 0 5px rgba(33,24,16,.65),inset 0 0 0 8px rgba(194,150,92,.36),0 7px 0 #1c140e,7px 17px 24px rgba(6,5,4,.55),26px 40px 65px rgba(7,5,4,.62)}
    .art-frame.current .mat img{filter:saturate(1) contrast(1.02)}
    .room.focused .art-frame:not(.current){filter:brightness(.68)}

    /* Ambient camera glass and a minimal, unobtrusive chapter index. */
    .cinema{position:absolute;inset:0;z-index:27;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 41%,rgba(3,3,3,.18) 72%,rgba(0,0,0,.59));box-shadow:inset 0 0 105px rgba(0,0,0,.34)}
    .shutter{position:absolute;inset:0;z-index:26;pointer-events:none;opacity:0;background:#0b0a09;transition:opacity .9s ease}
    .shutter.dim{opacity:.23}
    .progress{position:absolute;bottom:max(27px,env(safe-area-inset-bottom) + 19px);left:50%;transform:translateX(-50%);z-index:34;display:flex;gap:11px;align-items:center;opacity:0;transition:opacity 1s ease}
    .room.visible .progress{opacity:1}
    .progress button{padding:9px 2px;border:0;background:none;cursor:pointer}
    .progress i{display:block;width:23px;height:2px;border-radius:3px;background:#d0b9955c;transition:background .45s ease,transform .45s ease}
    .progress button.current i{background:#f1d6a9;transform:scaleY(1.5)}
    .replay{position:absolute;right:max(25px,env(safe-area-inset-right) + 18px);bottom:max(22px,env(safe-area-inset-bottom) + 15px);z-index:34;display:none;color:#e3c9a9;border:1px solid #d8bf986b;background:#12100ec9;padding:11px 18px;letter-spacing:.16em;text-transform:uppercase;font-size:9px;cursor:pointer}
    .replay.show{display:block}
    .replay:hover{background:#30241a}
    /* Visible ways to leave a close-up and proceed to the final chapter. */
    .wide-view,.final-chapter{
      position:absolute;z-index:42;bottom:max(82px,calc(env(safe-area-inset-bottom) + 72px));
      border:1px solid rgba(222,192,147,.65);background:rgba(18,15,13,.88);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      padding:15px 20px;color:#f6e9d6;font-size:10px;font-weight:500;
      letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
      opacity:0;visibility:hidden;pointer-events:none;transform:translateY(12px);
      transition:opacity .55s ease,transform .55s var(--ease),background .25s ease,visibility .55s;
      box-shadow:0 7px 22px rgba(0,0,0,.3);
    }
    .wide-view{left:max(25px,calc(env(safe-area-inset-left) + 20px))}
    .final-chapter{right:max(25px,calc(env(safe-area-inset-right) + 20px));border-color:rgba(219,184,131,.85);color:#f7d6aa}
    .wide-view.show,.final-chapter.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
    .wide-view:hover,.final-chapter:hover{background:rgba(69,52,37,.95)}
    .gallery-curtain{position:fixed;inset:0;background:#090909;z-index:99;opacity:0;pointer-events:none;transition:opacity 1.45s ease}
    .gallery-curtain.closing{opacity:1;pointer-events:auto}
    @media(max-width:650px){
      .wide-view,.final-chapter{bottom:max(91px,calc(env(safe-area-inset-bottom) + 78px));padding:13px 13px;font-size:9px;letter-spacing:.08em}
      .wide-view{left:11px}.final-chapter{right:11px}
      .replay{right:11px;bottom:max(20px,env(safe-area-inset-bottom) + 14px)}
    }
    @media(max-width:650px){
      .progress{gap:7px;bottom:max(24px,env(safe-area-inset-bottom) + 16px)}
      .progress i{width:17px}
      .replay{right:13px;bottom:69px;padding:10px 12px;font-size:9px}
      .intro-copy .last{margin-top:24px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
      .intro-copy p{opacity:1;transform:none}
    }
  </style>
  <script>
    // Only direct GitHub Pages visits are redirected; iframe chapters work normally.
    if (window.top === window.self && location.hostname.endsWith('.github.io')) {
      location.replace('./');
    }
  </script>
</head>
<body>
<main class="experience">
  <section class="chapter-intro" id="chapterIntro" aria-label="Introduction">
    <div class="intro-copy">
      <p class="first">Okay, okay…</p>
      <p class="second">Enough talking.</p>
      <p class="last">A few cool photos.</p>
    </div>
  </section>
  <section class="room" id="room" aria-label="Our photographs in a private gallery" aria-hidden="true">
    <div class="world" id="world">
      <div class="cornice" aria-hidden="true"></div>
      <div class="picture-rail" aria-hidden="true"></div>
      <div class="sconce left" aria-hidden="true"></div>
      <div class="sconce right" aria-hidden="true"></div>
      <div class="baseboard" aria-hidden="true"></div>
      <div class="floor" aria-hidden="true"></div>
      <div class="pool" style="left:315px" aria-hidden="true"></div>
      <div class="pool" style="left:735px" aria-hidden="true"></div>
      <div class="pool" style="left:1125px" aria-hidden="true"></div>
      <div class="pool" style="left:1565px" aria-hidden="true"></div>
      <div class="pool" style="left:2025px" aria-hidden="true"></div>
      <div class="pool" style="left:2400px" aria-hidden="true"></div>
      <div class="pool" style="left:2845px" aria-hidden="true"></div>
      <div class="lamp" style="left:314px" aria-hidden="true"></div>
      <div class="lamp" style="left:724px" aria-hidden="true"></div>
      <div class="lamp" style="left:1116px" aria-hidden="true"></div>
      <div class="lamp" style="left:1556px" aria-hidden="true"></div>
      <div class="lamp" style="left:2016px" aria-hidden="true"></div>
      <div class="lamp" style="left:2391px" aria-hidden="true"></div>
      <div class="lamp" style="left:2836px" aria-hidden="true"></div>
      <button class="art-frame" data-photo="0" style="left:180px;top:320px;width:280px;height:470px" aria-label="View photograph 1">

      <button class="art-frame" data-photo="3" style="left:1340px;top:250px;width:440px;height:355px" aria-label="View photograph 4">

      </button>
      <button class="art-frame" data-photo="4" style="left:1840px;top:322px;width:280px;height:475px" aria-label="View photograph 5">

      </button>
      <button class="art-frame" data-photo="5" style="left:2175px;top:258px;width:445px;height:310px" aria-label="View photograph 6">
        <span class="mat"><img src="assets/gallery-06.webp" alt="Nathalie and Kerem sharing a playful hug at home" decoding="async"></span>
      </button>
      <button class="art-frame" data-photo="6" style="left:2690px;top:332px;width:285px;height:465px" aria-label="View photograph 7">
        <span class="mat"><img src="assets/gallery-07.webp" alt="Nathalie and Kerem taking a mirror photo with Candice" decoding="async"></span>

    </div>
    <div class="cinema" aria-hidden="true"></div>
    <div class="shutter" id="shutter" aria-hidden="true"></div>
    <nav class="progress" id="progress" aria-label="Gallery navigation">
      <button data-go="0" aria-label="Photo 1"><i></i></button>
      <button data-go="1" aria-label="Photo 2"><i></i></button>
      <button data-go="2" aria-label="Photo 3"><i></i></button>
      <button data-go="3" aria-label="Photo 4"><i></i></button>
      <button data-go="4" aria-label="Photo 5"><i></i></button>

    </nav>
    <button class="replay" id="replay" type="button">Replay</button>
    <button class="wide-view" id="wideView" type="button" aria-label="Return to the full gallery wall">← View Full Gallery</button>
    <button class="final-chapter" id="finalChapter" type="button">One Last Thing →</button>
  </section>
  <div class="gallery-curtain" id="galleryCurtain" aria-hidden="true"></div>
</main>
<script>
(() => {
  const intro = document.getElementById('chapterIntro');
  const room = document.getElementById('room');
  const world = document.getElementById('world');
  const shutter = document.getElementById('shutter');
  const frames = [...document.querySelectorAll('.art-frame')];
  const dots = [...document.querySelectorAll('.progress button')];
  const replay = document.getElementById('replay');
  const wideView = document.getElementById('wideView');
  const finalChapter = document.getElementById('finalChapter');
  const galleryCurtain = document.getElementById('galleryCurtain');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const WORLD_WIDTH = 3200, WORLD_HEIGHT = 1140;
  let active = -1, timer = null, started = false;
  let manual = false;
  let touchStartX = null;
  const TRAVEL = reduceMotion ? 300 : 2500;
  const DWELL = reduceMotion ? 4000 : 3600;

  function camera(transform, instant=false) {
    world.style.transitionDuration = instant ? '0ms' : `${TRAVEL}ms`;
    world.style.transform = transform;
  }

  function overview(instant=false) {
    const w=innerWidth,h=innerHeight;
    let scale = Math.min((w - Math.min(65,w*.08))/WORLD_WIDTH,(h - Math.min(75,h*.08))/WORLD_HEIGHT);
    // True wide angle even on phones: the entire picture wall stays in frame.
    const x=w/2-WORLD_WIDTH*scale/2;
    const y=h/2-WORLD_HEIGHT*scale/2;
    camera(`translate3d(${x}px,${y}px,0) scale(${scale})`,instant);
  }

  function focus(index, instant=false) {
    if(index<0 || index>=frames.length)return;
    active=index;
    const target=frames[index];
    const x0=parseFloat(target.style.left),y0=parseFloat(target.style.top);
    const fw=parseFloat(target.style.width),fh=parseFloat(target.style.height);
    const w=innerWidth,h=innerHeight;
    const mobile=w<650;
    const scale=Math.min((w*(mobile?.86:.70))/fw,(h*(mobile?.70:.73))/fh);
    const x=w*.5-(x0+fw*.5)*scale;
    const y=h*.49-(y0+fh*.5)*scale;
    camera(`translate3d(${x}px,${y}px,0) scale(${scale})`,instant);
    room.classList.add('focused');
    frames.forEach((frame,i)=>frame.classList.toggle('current',i===index));
    dots.forEach((dot,i)=>dot.classList.toggle('current',i===index));
    replay.classList.remove('show');
    finalChapter.classList.remove('show');
    wideView.classList.add('show');
    shutter.classList.add('dim');
    window.setTimeout(()=>{if(active===index)shutter.classList.remove('dim')},reduceMotion?0:550);
  }

  function returnToWideView(instant=false) {
    clearTimeout(timer);
    manual=true;
    active=-1;
    room.classList.remove('focused');
    frames.forEach(frame=>frame.classList.remove('current'));
    dots.forEach(dot=>dot.classList.remove('current'));
    wideView.classList.remove('show');
    shutter.classList.remove('dim');
    overview(instant);
    const delay=instant ? 0 : TRAVEL+120;
    timer=setTimeout(()=>{
      if(active===-1){
        replay.classList.add('show');
        finalChapter.classList.add('show');
      }
    },delay);
  }

  function finishTour(){
    returnToWideView();
  }

  function tourFrom(index) {
    clearTimeout(timer);
    focus(index);
    if(!manual) timer=setTimeout(()=>{
      if(index===frames.length-1) finishTour();
      else tourFrom(index+1);
    },TRAVEL+DWELL);
  }

  function start(){
    if(started) return;
    started=true;
    overview(true);
    room.classList.add('visible');
    room.setAttribute('aria-hidden','false');
    intro.classList.add('leave');
    timer=setTimeout(()=>tourFrom(0),reduceMotion?550:3000);
  }

  function jump(index){
    manual=true;
    clearTimeout(timer);
    if(!started)start();
    focus(index);
  }

  frames.forEach((f,i)=>f.addEventListener('click',()=>jump(i)));
  dots.forEach((d,i)=>d.addEventListener('click',()=>jump(i)));
  wideView.addEventListener('click',()=>returnToWideView());
  finalChapter.addEventListener('click',()=>{
    clearTimeout(timer);
    galleryCurtain.classList.add('closing');
    window.parent.postMessage({nadiStory:true,action:'anticipate',page:'finale.html'}, '*');
    setTimeout(()=>location.assign('finale.html'),reduceMotion?120:1510);
  });
  replay.addEventListener('click',()=>{
    manual=false;
    replay.classList.remove('show');
    finalChapter.classList.remove('show');
    wideView.classList.remove('show');
    active=-1;
    room.classList.remove('focused');
    frames.forEach(frame=>frame.classList.remove('current'));
    overview();
    clearTimeout(timer);
    timer=setTimeout(()=>tourFrom(0),reduceMotion?500:2100);
  });
  window.addEventListener('keydown', e=>{
    if(!started)return;
    if(e.key==='ArrowRight'){e.preventDefault();jump(Math.min(6,Math.max(active,0)+1));}
    if(e.key==='ArrowLeft'){e.preventDefault();jump(Math.max(0,active<0?0:active-1));}
    if(e.key==='Escape')finishTour();
  });
  room.addEventListener('touchstart',e=>{if(e.touches.length===1)touchStartX=e.touches[0].clientX},{passive:true});
  room.addEventListener('touchend',e=>{
    if(touchStartX===null)return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    touchStartX=null;
    if(Math.abs(dx)>65)jump(Math.max(0,Math.min(6,(active<0?0:active)+(dx<0?1:-1))));
  },{passive:true});
  window.addEventListener('resize',()=>{
    if(!started)return;
    if(active<0)overview(true);
    else focus(active,true);
  });

  const params=new URLSearchParams(location.search);
  const preview=params.get('preview');
  if(preview==='wall'||preview?.startsWith('photo')){
    intro.classList.add('leave');
    intro.style.display='none';
    started=true;
    room.classList.add('visible');room.setAttribute('aria-hidden','false');
    if(preview==='wall')returnToWideView(true);
    else focus(Math.max(0,Math.min(6,(parseInt(preview.replace('photo',''),10)||1)-1)),true);
  } else {
    requestAnimationFrame(()=>requestAnimationFrame(()=>intro.classList.add('reveal')));
    timer=setTimeout(start,reduceMotion?1300:5150);
  }
})();
</script>
  <script>
    // Music controls stay in index.html, so the soundtrack can survive chapter changes.
    (() => {
      if (window.parent === window) return;
      const send = (action, extra={}) => {
        try { window.parent.postMessage({nadiStory:true, action, ...extra}, '*'); } catch (_) {}
      };
      const page = location.pathname.split('/').pop();
      send('ready', {page});
      document.addEventListener('click', e => {
        if (e.target.closest('#openEnvelope, #tapLabel')) send('open-letter');
      }, true);
      for (const action of ['play','pause','ended','volumechange']) {
        document.addEventListener(action, e => {
          if (e.target.tagName === 'VIDEO') {
            const v = e.target;
            send('video', {event:action, videoId:v.id, audible:!v.muted && v.volume>0});
          }
        }, true);
      }
    })();
  </script>
</body>
