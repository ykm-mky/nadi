<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <meta name="description" content="A final birthday surprise, just for Nadi.">
  <title>One Last Thing — Nadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--ivory:#f3e7d9;--gold:#d9b98c;--ease:cubic-bezier(.22,1,.36,1)}
    *,*::before,*::after{box-sizing:border-box}
    html{background:#0c0d10;min-height:100%}
    body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ivory);font-family:'DM Sans',sans-serif;overflow-x:hidden;background:radial-gradient(ellipse at 50% 43%,#27221f 0%,#151519 48%,#080a0e 100%)}
    body::before{content:"";position:fixed;inset:0;opacity:.12;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 170 170' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.33'/%3E%3C/svg%3E")}
    button,a{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid #f3cf9e;outline-offset:6px}
    .opening{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#090a0d;transition:opacity 1.45s ease,visibility 1.45s}
    .opening.hide{opacity:0;visibility:hidden;pointer-events:none}
    .opening p{font:italic 500 clamp(46px,8vw,100px)/1.08 'Cormorant Garamond',Georgia,serif;color:#ecddc8;margin:0;text-align:center;padding:24px;letter-spacing:-.02em;opacity:0;transform:translateY(22px);animation:enter 1.3s .3s var(--ease) forwards}
    .opening em{color:var(--gold);font-style:italic}
    .content{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;min-height:100vh;min-height:100dvh;padding:clamp(36px,5vh,54px) 20px 44px;opacity:0;transform:translateY(15px);transition:opacity 1.55s var(--ease),transform 1.55s var(--ease)}
    .content.ready{opacity:1;transform:none}
    .overline{font-size:10px;letter-spacing:.33em;text-transform:uppercase;color:#c4a981;margin-bottom:8px}
    h1{font:italic 500 clamp(47px,7vw,82px)/1.04 'Cormorant Garamond',Georgia,serif;text-align:center;margin:0;color:#f5e9d9;letter-spacing:-.025em}
    .sub{color:#c8b8a3;font:italic 400 clamp(20px,2.5vw,29px)/1.25 'Cormorant Garamond',Georgia,serif;text-align:center;margin:0}
    .theater{position:relative;width:min(94vw,920px);height:min(58vh,600px);min-height:280px;max-height:690px;border:1px solid rgba(215,177,128,.46);background:radial-gradient(ellipse at center,#211c1c,#090a0c 74%);box-shadow:0 33px 96px rgba(0,0,0,.46),0 0 0 8px rgba(225,192,143,.038),inset 0 0 95px rgba(0,0,0,.7);overflow:hidden;display:grid;place-items:center;isolation:isolate}
    .theater::after{content:'';position:absolute;inset:12px;border:1px solid rgba(229,192,143,.13);pointer-events:none;z-index:4}
    .theater .film-glow{position:absolute;inset:0;pointer-events:none;opacity:.6;background:radial-gradient(circle at 50% 24%,rgba(221,176,112,.13),transparent 45%);animation:breathe 6s ease-in-out infinite}
    .placeholder{text-align:center;z-index:2;padding:26px;transition:opacity .65s ease}
    .placeholder.hide{opacity:0;pointer-events:none}
    .placeholder .line{display:block;width:40px;height:1px;margin:0 auto 25px;background:#b49267}
    .placeholder p{margin:0 0 8px;font:italic 500 clamp(26px,4vw,47px)/1.13 'Cormorant Garamond',Georgia,serif;color:#e9d4b6}
    .placeholder span{color:#a89b89;font-size:11px;line-height:1.8;letter-spacing:.03em}
    .play{margin-top:22px;padding:14px 25px;border:1px solid #c9a57e;color:#f5e9d5;background:#3b2a20e0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .25s ease}
    .play:hover{background:#644631}
    .play[hidden]{display:none}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050505;opacity:0;transition:opacity .7s ease;z-index:3}
    video.playing{opacity:1}
    .chapter-link{border:0;background:none;text-decoration:none;color:#dbc097;text-transform:uppercase;font-size:10px;letter-spacing:.21em;padding:13px 18px;cursor:pointer;transition:color .25s}
    .chapter-link:hover{color:#fff1dc}
    .curtain{position:fixed;inset:0;z-index:40;background:#08090b;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.45s ease,visibility 1.45s}
    .curtain.closing{opacity:1;visibility:visible;pointer-events:auto}
    @keyframes enter{to{opacity:1;transform:none}}
    @keyframes breathe{50%{opacity:.9}}
    @media(max-width:600px){.content{gap:19px;padding:34px 12px 32px}.theater{width:95vw;height:min(52dvh,590px);min-height:290px}.overline{font-size:9px}.placeholder p{font-size:31px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.opening p{opacity:1;transform:none}}
  </style>
  <script>
    // Only direct GitHub Pages visits are redirected; iframe chapters work normally.
    if (window.top === window.self && location.hostname.endsWith('.github.io')) {
      location.replace('./');
    }
  </script>
</head>
<body>
  <section class="opening" id="opening" aria-label="The final chapter"><p>One last thing<em>…</em></p></section>
  <main class="content" id="content">
    <div class="overline"></div>
    <h1>A little something from me Nathalie</h1>
    <p class="sub">Some things are better said out loud.</p>
    <div class="theater" id="theater">
      <div class="film-glow" aria-hidden="true"></div>
      <div class="placeholder" id="placeholder">
        <span class="line" aria-hidden="true"></span>
        <p id="filmText">One final surprise.</p>
        <span id="filmHint">A little message, made just for you.</span>
        <div><button class="play" id="play" type="button" hidden>Play My Message ▶</button></div>
      </div>
      <!-- Put final.mp4 in the same folder as this HTML page when it is ready. -->
      <video id="film" src="final.mp4" preload="metadata" playsinline controls aria-label="A personal birthday video message from Kerem"></video>
    </div>
    <a class="chapter-link" href="memories.html" id="explore">Explore The Story →</a>
  </main>
  <div class="curtain" id="curtain" aria-hidden="true"></div>
  <script>
    (()=>{
      const opening=document.getElementById('opening');
      const content=document.getElementById('content');
      const video=document.getElementById('film');
      const placeholder=document.getElementById('placeholder');
      const play=document.getElementById('play');
      const filmText=document.getElementById('filmText');
      const filmHint=document.getElementById('filmHint');
      const explore=document.getElementById('explore');
      const curtain=document.getElementById('curtain');
      const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      let transitioning=false;
      function navigate(){
        if(transitioning)return;
        transitioning=true;
        curtain.classList.add('closing');
        setTimeout(()=>location.assign('memories.html'),reduced?100:1480);
      }
      video.addEventListener('loadedmetadata',()=>{
        filmText.textContent='A message from Kerem.';
        filmHint.textContent='Press play whenever you are ready.';
        play.hidden=false;
      });
      video.addEventListener('error',()=>{
        play.hidden=true;
        filmText.textContent='One final surprise…';
        filmHint.textContent='Coming soon. The story is already yours to revisit.';
      });
      play.addEventListener('click',async()=>{
        try{
          video.muted=false;
          await video.play();
          video.classList.add('playing');
          placeholder.classList.add('hide');
        }catch(e){filmHint.textContent='Use the video controls to play the message.';video.classList.add('playing')}
      });
      video.addEventListener('ended',()=>setTimeout(navigate,reduced?120:1300));
      explore.addEventListener('click',e=>{e.preventDefault();video.pause();navigate()});
      setTimeout(()=>{
        opening.classList.add('hide');
        content.classList.add('ready');
      },reduced?250:3100);
    })();
  </script>
  <script>
    // Music controls stay in index.html, so the soundtrack can survive chapter changes.
    (() => {
      if (window.parent === window) return;
      const send = (action, extra={}) => {
        try { window.parent.postMessage({nadiStory:true, action, ...extra}, '*'); } catch (_) {}
      };
      const page = location.pathname.split('/').pop();
      send('ready', {page});
      document.addEventListener('click', e => {
        if (e.target.closest('#openEnvelope, #tapLabel')) send('open-letter');
      }, true);
      for (const action of ['play','pause','ended','volumechange']) {
        document.addEventListener(action, e => {
          if (e.target.tagName === 'VIDEO') {
            const v = e.target;
            send('video', {event:action, videoId:v.id, audible:!v.muted && v.volume>0});
          }
        }, true);
      }
    })();
  </script>
</body>
</html>
