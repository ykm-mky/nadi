<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141820">
  <meta name="description" content="A birthday letter for Nathalie Celine Domnick.">
  <title>For Nathalie Celine Domnick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600;1,700&family=DM+Sans:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --night: #12161d;
      --night-soft: #202632;
      --gold: #c9a56b;
      --gold-soft: #ecdab8;
      --paper: #f7f0e3;
      --paper-deep: #efe3ce;
      --ink: #48362e;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: radial-gradient(circle at 20% 20%, rgba(94, 72, 57, .18), transparent 28%),
                  radial-gradient(circle at 80% 80%, rgba(109, 79, 57, .12), transparent 30%),
                  linear-gradient(145deg, #212530 0%, #171c26 48%, #0f141b 100%);
      color: #f8f1e7;
      font-family: 'DM Sans', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
    }

    button { font: inherit; }
    button:focus-visible { outline: 2px solid #f2d3a3; outline-offset: 7px; }

    .app {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      isolation: isolate;
    }

    .intro {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 18px 40px;
      transition: opacity .9s var(--ease), transform 1s var(--ease), visibility .9s;
    }

    .intro-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-6px);
    }

    .envelope-trigger {
      width: min(86vw, 620px);
      aspect-ratio: 620 / 430;
      border: 0;
      background: none;
      padding: 0;
      position: relative;
      cursor: pointer;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(38px) scale(.96);
      animation: envelope-arrive 1.45s .16s var(--ease) forwards;
      filter: drop-shadow(0 28px 34px rgba(0, 0, 0, .38));
      transition: filter .45s var(--ease);
    }

    .envelope-trigger:hover:not(:disabled) {
      filter: drop-shadow(0 36px 40px rgba(0, 0, 0, .46));
    }

    .envelope-trigger:disabled { cursor: default; }

    .envelope {
      position: absolute;
      inset: 0;
      perspective: 1600px;
      transform-style: preserve-3d;
    }

    .envelope-base {
      position: absolute;
      inset: 14% 4% 6%;
      border-radius: 8px;
      background: linear-gradient(135deg, #e7d2b2 0%, #f4e7cd 42%, #dbc09a 100%);
      border: 1px solid rgba(101, 74, 49, .28);
      box-shadow: inset 0 0 0 1px rgba(255, 247, 229, .46),
                  inset 0 24px 35px rgba(255, 255, 255, .18),
                  inset 0 -16px 28px rgba(121, 85, 52, .14);
    }

    .envelope-base::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: .18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.58' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='.38'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .recipient-name {
      position: absolute;
      z-index: 6;
      top: 25.5%;
      left: 50%;
      width: 82%;
      transform: translateX(-50%);
      display: block;
      text-align: center;
      white-space: nowrap;
      color: #624435;
      text-shadow: 0 1px rgba(255,255,255,.40);
      font: italic 600 clamp(21px, 3.7vw, 38px)/1.12 'Cormorant Garamond', Georgia, serif;
      letter-spacing: -.025em;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    .envelope-years {
      position: absolute;
      z-index: 6;
      top: 36%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      color: #80644f;
      font: 500 clamp(13px, 2.0vw, 18px)/1.15 'Cormorant Garamond', Georgia, serif;
      letter-spacing: .09em;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    .envelope-pocket,
    .envelope-flap {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 6%;
      height: 80%;
      pointer-events: none;
    }

    .envelope-pocket { z-index: 3; }
    .envelope-pocket svg,
    .envelope-flap svg { width: 100%; height: 100%; display: block; }

    .envelope-flap {
      z-index: 5;
      transform-origin: 50% 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition: transform 1.1s .26s cubic-bezier(.65,.02,.22,1);
      filter: drop-shadow(0 4px 4px rgba(73, 49, 29, .18));
    }

    .wax-seal {
      position: absolute;
      top: 51%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(50px, 8.5vw, 78px);
      aspect-ratio: 1;
      border-radius: 46% 54% 52% 48% / 50% 48% 52% 50%;
      z-index: 7;
      display: grid;
      place-items: center;
      color: #e5b7a2;
      font: 700 clamp(26px, 4.2vw, 38px)/1 'Cormorant Garamond', Georgia, serif;
      background: radial-gradient(circle at 30% 25%, rgba(255, 204, 178, .32), transparent 42%),
                  radial-gradient(circle at 70% 75%, #6a2430 0%, #823040 48%, #9a4855 100%);
      box-shadow: inset 0 0 0 2px rgba(240, 180, 165, .24),
                  inset 0 0 0 6px rgba(86, 29, 36, .34),
                  inset 4px 5px 12px rgba(61, 16, 24, .44),
                  0 7px 10px rgba(0, 0, 0, .22);
      text-shadow: 0 1px rgba(255, 222, 197, .22);
      transition: opacity .35s ease, transform .55s var(--ease);
    }

    /* An engraved calligraphic initial; keep the seal itself perfectly level. */
    .seal-letter {
      display: inline-block;
      font-family: 'Pinyon Script', 'Cormorant Garamond', cursive;
      font-size: clamp(28px, 3.5vw, 40px);
      font-weight: 400;
      font-style: normal;
      line-height: 1;
      transform: translate(-6px, 3px) rotate(-4deg);
      text-shadow: 0 1px 0 rgba(255, 222, 197, .27), 0 -1px 1px rgba(47, 9, 18, .65);
    }

    .tap-label {
      margin-top: clamp(48px, 8vh, 84px);
      border: 0;
      background: none;
      padding: 0 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .34em;
      color: #d2bc98;
      font: 500 10px/1.3 'DM Sans', sans-serif;
      opacity: 0;
      transform: translateY(12px);
      animation: label-arrive 1.1s 1.05s ease forwards;
    }

    .tap-label::before {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      margin: 0 auto 20px;
      background: rgba(210, 188, 152, .52);
    }

    .opening .recipient-name, .opening .envelope-years { opacity: 0; }

    .opening .wax-seal {
      opacity: 0;
      transform: translate(-50%, -68%) scale(.72);
    }

    .opening .envelope-flap {
      transform: rotateX(178deg);
    }

    .opening .envelope-trigger {
      animation: none;
      opacity: 1;
      transform: none;
    }

    .opening .intro {
      opacity: 0;
      transform: scale(1.06);
      visibility: hidden;
      transition-delay: 1.58s;
    }

    .letter-scene {
      position: absolute;
      inset: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      justify-items: center;
      align-content: center;
      overflow-y: auto;
      visibility: hidden;
      opacity: 0;
      transform: translateY(24px) scale(.985);
      padding: 20px 15px 25px;
      transition: opacity 1.1s var(--ease), transform 1.2s var(--ease), visibility 1.1s;
    }

    .letter-scene.visible {
      visibility: visible;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .letter-stage {
      width: min(100%, 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .paper {
      position: relative;
      width: 100%;
      height: min(730px, calc(100dvh - 138px));
      min-height: 400px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.86), transparent 26%),
        radial-gradient(circle at 88% 90%, rgba(190,160,119,.16), transparent 24%),
        linear-gradient(180deg, #fbf6eb 0%, #f5eddf 48%, #efe3ce 100%);
      border: 1px solid rgba(169, 138, 101, .32);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.24) inset,
        0 18px 26px rgba(0,0,0,.16),
        0 40px 95px rgba(0,0,0,.30),
        0 5px 0 rgba(220, 197, 160, .72) inset;
      overflow: hidden;
    }

    .paper::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='t'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.46' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23t)' opacity='.34'/%3E%3C/svg%3E");
    }

    .paper::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(183, 154, 115, .16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
      pointer-events: none;
    }

    .paper-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(34px, 5vw, 53px) clamp(28px, 7vw, 75px) clamp(27px, 4vw, 43px);
    }

    .paper-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: clamp(15px, 2.4vh, 24px);
    }

    .paper-heading {
      margin: 0;
      color: #66463c;
      font: italic 600 clamp(30px, 4.2vw, 46px)/1.06 'Cormorant Garamond', Georgia, serif;
      letter-spacing: -.02em;
    }

    .paper-date {
      white-space: nowrap;
      padding-top: 6px;
      color: #8e765f;
      font: italic 600 clamp(15px, 1.7vw, 18px)/1.1 'Cormorant Garamond', Georgia, serif;
      letter-spacing: .04em;
    }

    .letter-text {
      margin: 0;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(151, 119, 84, .28) transparent;
      overscroll-behavior: contain;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: #493b34;
      font: italic 500 clamp(18px, 2.05vw, 21px)/1.35 'Cormorant Garamond', Georgia, serif;
    }

    .caret {
      display: inline-block;
      width: 1px;
      height: 1em;
      background: #a07c5f;
      vertical-align: -.13em;
      animation: caret-blink .72s step-end infinite;
    }
    .caret.hidden { display: none; }

    .signature-row {
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      padding-top: 18px;
    }

    .signature {
      opacity: 0;
      transition: opacity .8s ease;
      color: #825f50;
      font: italic 600 clamp(23px, 2.7vw, 29px)/1.15 'Cormorant Garamond', Georgia, serif;
    }
    .signature.shown { opacity: 1; }

    .next {
      margin-top: 22px;
      padding: 15px 24px;
      border: 1px solid rgba(205, 171, 123, .58);
      background: transparent;
      color: #f7ebdb;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .7s ease, transform .7s var(--ease), background .25s ease;
    }
    .next:hover { background: rgba(208, 177, 129, .12); }
    .next.shown {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .next span { font-size: 16px; margin-left: 9px; vertical-align: -1px; }

    .up-next {
      position: absolute;
      inset: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.1s ease, visibility 1.1s;
    }
    .up-next.visible { opacity: 1; visibility: visible; }
    .up-next h2 {
      margin: 0 0 18px;
      color: #f5ead8;
      font: italic 600 clamp(42px, 7vw, 80px)/1.1 'Cormorant Garamond', Georgia, serif;
    }
    .restart {
      border: 0;
      background: none;
      padding: 10px;
      color: #cfb18a;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .2em;
      font: 500 10px/1.3 'DM Sans', sans-serif;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    @keyframes envelope-arrive {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes label-arrive {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes caret-blink {
      50% { opacity: 0; }
    }

    @media (max-width: 640px) {
      .envelope-trigger { width: min(94vw, 520px); }
      .tap-label { margin-top: 64px; font-size: 9px; letter-spacing: .30em; }
      .letter-scene { padding: 14px 10px 18px; }
      .paper { height: calc(100dvh - 112px); min-height: 390px; }
      .paper-inner { padding: 30px 27px 25px; }
      .paper::after { inset: 8px; }
      .paper-top { align-items: baseline; gap: 8px; margin-bottom: 14px; }
      .paper-heading { font-size: clamp(27px, 7.3vw, 37px); }
      .paper-date { font-size: 15px; }
      .letter-text { font-size: clamp(17px, 4.8vw, 19px); line-height: 1.29; }
      .signature-row { padding-top: 15px; }
      .next { margin-top: 14px; padding: 12px 21px; }
    }

    @media (max-width: 360px) {
      .paper-inner { padding-left: 20px; padding-right: 20px; }
      .paper-top { flex-wrap: wrap; gap: 6px; }
      .paper-date { margin-left: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .envelope-trigger, .tap-label { opacity: 1; transform: none; }
    }
  </style>
  <script>
    // Only direct GitHub Pages visits are redirected; iframe chapters work normally.
    if (window.top === window.self && location.hostname.endsWith('.github.io')) {
      location.replace('./');
    }
  </script>
</head>
<body>
  <main class="app" id="app">
    <section class="intro" id="intro" aria-label="A letter for Nathalie">
      <div class="intro-inner">
        <button class="envelope-trigger" id="openEnvelope" aria-label="Open Nathalie's letter">
          <span class="envelope" aria-hidden="true">
            <span class="envelope-base"></span>
            <span class="envelope-pocket">
              <svg viewBox="0 0 620 360" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="pocketLeft" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f0dfc2"/>
                    <stop offset="1" stop-color="#d7bd98"/>
                  </linearGradient>
                  <linearGradient id="pocketRight" x1="1" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ead6b6"/>
                    <stop offset="1" stop-color="#f2e4c9"/>
                  </linearGradient>
                  <linearGradient id="pocketBottom" x1=".5" y1="0" x2=".5" y2="1">
                    <stop offset="0" stop-color="#f3e5cc"/>
                    <stop offset="1" stop-color="#debf95"/>
                  </linearGradient>
                </defs>
                <path d="M2 2 L310 212 L2 358 Z" fill="url(#pocketLeft)" stroke="#b89a73" stroke-opacity=".42" stroke-width="1.4"/>
                <path d="M618 2 L310 212 L618 358 Z" fill="url(#pocketRight)" stroke="#b89a73" stroke-opacity=".42" stroke-width="1.4"/>
                <path d="M2 358 L310 182 L618 358 Z" fill="url(#pocketBottom)" stroke="#ba9e77" stroke-opacity=".56" stroke-width="1.4"/>
                <path d="M2 2 V358 H618 V2" fill="none" stroke="#b6976e" stroke-opacity=".56" stroke-width="2"/>
              </svg>
            </span>
            <span class="envelope-flap">
              <svg viewBox="0 0 620 360" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="flapTone" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f5e8d0"/>
                    <stop offset=".55" stop-color="#ead7b6"/>
                    <stop offset="1" stop-color="#dabc93"/>
                  </linearGradient>
                </defs>
                <path d="M2 2 H618 L310 222 Z" fill="url(#flapTone)" stroke="#ba9d76" stroke-opacity=".58" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="recipient-name">Nathalie Celine Domnick</span>
            <span class="envelope-years">28.11.2000 — 28.11.2026</span>
            <span class="wax-seal"><span class="seal-letter">M</span></span>
          </span>
        </button>
        <button class="tap-label" id="tapLabel" type="button">Tap to open</button>
      </div>
    </section>

    <section class="letter-scene" id="letterScene" aria-label="Birthday letter" aria-hidden="true">
      <div class="letter-stage">
        <article class="paper">
          <div class="paper-inner">
            <div class="paper-top">
              <h1 class="paper-heading">My dearest Nathalie,</h1>
              <span class="paper-date">November 28</span>
            </div>
            <p class="letter-text"><span id="typedText"></span><span class="caret" id="caret" aria-hidden="true"></span></p>
            <div class="signature-row">
              <span class="signature" id="signature">Kerem</span>
            </div>
          </div>
        </article>
        <button class="next" id="nextButton" disabled>Let’s Begin <span aria-hidden="true">↗</span></button>
      </div>
    </section>

    <section class="up-next" id="upNext" aria-label="The next chapter" aria-hidden="true">
      <div>
        <h2>The journey begins…</h2>
        <button class="restart" id="restart">Read the letter again</button>
      </div>
    </section>
  </main>

  <script>
    const LETTER_TEXT = `Today is your day, and I wanted to give you something a little different.

Some people are far too vivid to be summed up in a few sentences. You are my favorite proof of that. Words alone are never quite enough for your endless energy, your brightness, and the joy you bring into my life.

So I made you a little journey. Just a few stops to remind you how deeply you are seen, cherished, and loved.

Before we begin, there is only one thing I want to say:

Happy Birthday, my love.`;
    const app = document.getElementById('app');
    const openEnvelope = document.getElementById('openEnvelope');
    const intro = document.getElementById('intro');
    const letterScene = document.getElementById('letterScene');
    const typedText = document.getElementById('typedText');
    const letterText = document.querySelector('.letter-text');
    const caret = document.getElementById('caret');
    const signature = document.getElementById('signature');
    const nextButton = document.getElementById('nextButton');
    const upNext = document.getElementById('upNext');
    const restart = document.getElementById('restart');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let opened = false;
    let typingTimer = null;
    let transitionTimer = null;

    function finishTyping() {
      caret.classList.add('hidden');
      signature.classList.add('shown');
      nextButton.disabled = false;
      nextButton.classList.add('shown');
    }

    function typeLetter() {
      const characters = Array.from(LETTER_TEXT);
      let index = 0;
      typedText.textContent = '';
      letterText.scrollTop = 0;
      caret.classList.remove('hidden');
      signature.classList.remove('shown');
      nextButton.classList.remove('shown');
      nextButton.disabled = true;

      if (reducedMotion) {
        typedText.textContent = LETTER_TEXT;
        finishTyping();
        return;
      }

      const step = () => {
        if (index >= characters.length) {
          finishTyping();
          return;
        }

        const character = characters[index++];
        typedText.textContent += character;
        letterText.scrollTop = letterText.scrollHeight;
        const delay = character === '\n' ? 250 : /[.!?]/.test(character) ? 230 : /[,;:—]/.test(character) ? 95 : 27;
        typingTimer = window.setTimeout(step, delay);
      };

      typingTimer = window.setTimeout(step, 330);
    }

    openEnvelope.addEventListener('click', () => {
      if (opened) return;
      opened = true;
      openEnvelope.disabled = true;
      app.classList.add('opening');

      transitionTimer = window.setTimeout(() => {
        intro.setAttribute('aria-hidden', 'true');
        letterScene.classList.add('visible');
        letterScene.setAttribute('aria-hidden', 'false');
        letterScene.scrollTop = 0;
        typeLetter();
      }, reducedMotion ? 0 : 1920);
    });

    document.getElementById('tapLabel').addEventListener('click', () => openEnvelope.click());

    nextButton.addEventListener('click', () => {
      if (nextButton.disabled) return;
      window.parent.postMessage({nadiStory:true,action:'anticipate',page:'journey.html'}, '*');
      window.location.assign('journey.html');
    });

    restart.addEventListener('click', () => {
      window.clearTimeout(typingTimer);
      window.clearTimeout(transitionTimer);
      upNext.classList.remove('visible');
      upNext.setAttribute('aria-hidden', 'true');
      app.classList.remove('opening');
      intro.setAttribute('aria-hidden', 'false');
      letterScene.classList.remove('visible');
      letterScene.setAttribute('aria-hidden', 'true');
      openEnvelope.disabled = false;
      opened = false;
    });
  </script>
  <script>
    // Music controls stay in index.html, so the soundtrack can survive chapter changes.
    (() => {
      if (window.parent === window) return;
      const send = (action, extra={}) => {
        try { window.parent.postMessage({nadiStory:true, action, ...extra}, '*'); } catch (_) {}
      };
      const page = location.pathname.split('/').pop();
      send('ready', {page});
      document.addEventListener('click', e => {
        if (e.target.closest('#openEnvelope, #tapLabel')) send('open-letter');
      }, true);
      for (const action of ['play','pause','ended','volumechange']) {
        document.addEventListener(action, e => {
          if (e.target.tagName === 'VIDEO') {
            const v = e.target;
            send('video', {event:action, videoId:v.id, audible:!v.muted && v.volume>0});
          }
        }, true);
      }
    })();
  </script>
</body>
</html>
