<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08070a">
  <meta name="description" content="One more little chapter, starring Nadi.">
  <title>A Little More Nadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --background: #08070a;
      --cream: #f8efe6;
      --rose: #e1aab7;
      --gold: #dfbda5;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; overflow-x: hidden; color: var(--cream); background: var(--background); font-family: 'DM Sans', sans-serif; }
    .experience { min-height: 100vh; min-height: 100dvh; position: relative; isolation: isolate; }
    .scene { position: absolute; inset: 0; min-height: 100vh; min-height: 100dvh; opacity: 0; visibility: hidden; transition: opacity 1.65s ease, visibility 1.65s; }
    .scene.active { visibility: visible; opacity: 1; }
    .intro { display: grid; place-items: center; text-align: center; padding: 28px 22px; background: #050506; }
    .intro::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 52% 52%, rgba(158,101,126,.11), transparent 55%); pointer-events: none; }
    .intro-inner { max-width: 1000px; position: relative; }
    .intro-lead { margin: 0 0 24px; color: var(--rose); font: italic 500 clamp(59px, 8.1vw, 105px)/1 'Cormorant Garamond', Georgia, serif; letter-spacing: -.04em; }
    .intro-message { margin: 0; color: var(--cream); font: italic 500 clamp(37px, 6vw, 73px)/1.1 'Cormorant Garamond', Georgia, serif; letter-spacing: -.022em; text-wrap: balance; }
    .intro-tagline { margin: 30px auto 0; max-width: 660px; color: #d9bdc4; font: italic 400 clamp(22px, 3vw, 33px)/1.2 'Cormorant Garamond', Georgia, serif; text-wrap: balance; }
    .intro-lead, .intro-message, .intro-tagline { opacity: 0; transform: translateY(24px); transition: opacity 1.15s ease, transform 1.45s var(--ease); }
    .intro.active.revealed .intro-lead, .intro.active.revealed .intro-message, .intro.active.revealed .intro-tagline { opacity: 1; transform: none; }
    .intro.active.revealed .intro-message { transition-delay: 1.05s; }
    .intro.active.revealed .intro-tagline { transition-delay: 2.3s; }

    .gallery { overflow: auto; background: radial-gradient(ellipse at 83% 25%, rgba(132,55,92,.30), transparent 44%), radial-gradient(ellipse at 11% 75%, rgba(124,71,85,.22), transparent 42%), linear-gradient(135deg, #17131b 0%, #171019 45%, #0b0910 100%); }
    .gallery::before { content: ''; position: absolute; inset: 0; opacity: .17; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.62' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E"); }
    .gallery::after { content: ''; position: absolute; inset: 16px; border: 1px solid rgba(241,201,205,.10); pointer-events: none; }
    .bokeh { position: absolute; width: 8px; height: 8px; border: 1px solid rgba(255,206,220,.35); border-radius: 50%; box-shadow: 0 0 23px rgba(240,175,205,.15); pointer-events: none; opacity: .7; animation: float 9s ease-in-out infinite alternate; }
    .bokeh.one { left: 12%; top: 19%; width: 13px; height: 13px; }
    .bokeh.two { left: 70%; top: 14%; animation-delay: -3s; }
    .bokeh.three { left: 87%; top: 72%; width: 16px; height: 16px; animation-delay: -6s; }
    .bokeh.four { left: 27%; top: 82%; width: 5px; height: 5px; animation-delay: -2s; }
    @keyframes float { to { transform: translate(16px,-18px); opacity: .25; } }
    .gallery-inner { width: min(1420px,100%); min-height: 100vh; min-height: 100dvh; margin: auto; padding: clamp(44px,7vh,85px) clamp(28px,5vw,76px); display: grid; grid-template-columns: minmax(0,1fr) minmax(230px,.86fr) minmax(0,1.1fr); gap: clamp(16px,3.4vw,60px); align-items: center; position: relative; z-index: 2; }
    .photo { margin: 0; position: relative; padding: clamp(7px,.9vw,12px); padding-bottom: clamp(20px,2.2vw,30px); background: #f8f2ed; box-shadow: 0 32px 65px rgba(0,0,0,.50), 0 0 0 1px rgba(255,255,255,.18); opacity: 0; transition: opacity 1.45s ease, transform 2.0s var(--ease); }
    .photo img { width: 100%; height: auto; display: block; background: #f6e9e8; object-fit: contain; }
    .photo-one { grid-column: 1; grid-row: 1; max-width: 345px; justify-self: end; transform: translate(-70px,90px) rotate(-12deg) scale(.85); }
    .photo-one img { aspect-ratio: 885 / 1320; object-fit: cover; }
    .photo-two { grid-column: 3; grid-row: 1; max-width: 395px; justify-self: start; transform: translate(70px,85px) rotate(12deg) scale(.85); }
    .photo-two img { aspect-ratio: 1532 / 1600; object-fit: cover; }
    .gallery.active.revealed .photo-one { transform: translateY(10px) rotate(-5.5deg) scale(1); opacity: 1; transition-delay: .25s; }
    .gallery.active.revealed .photo-two { transform: translateY(-13px) rotate(5deg) scale(1); opacity: 1; transition-delay: 1s; }
    .photo figcaption { text-align: center; color: #6f5360; margin-top: 9px; font: italic 500 clamp(14px,1.35vw,18px)/1 'Cormorant Garamond', Georgia, serif; }
    .center-copy { grid-column: 2; grid-row: 1; text-align: center; opacity: 0; transform: translateY(24px); transition: opacity 1.3s 1.65s ease, transform 1.5s 1.65s var(--ease); }
    .gallery.active.revealed .center-copy { opacity: 1; transform: none; }
    .eyebrow { display: block; color: #d7a8b8; font: 500 clamp(9px,1vw,11px)/1.4 'DM Sans',sans-serif; text-transform: uppercase; letter-spacing: .27em; }
    .gallery-title { margin: 21px 0; color: var(--cream); font: italic 500 clamp(51px,5vw,82px)/.98 'Cormorant Garamond', Georgia, serif; letter-spacing: -.035em; text-wrap: balance; }
    .gallery-title em { color: #efbdd0; font-weight: 500; }
    .gallery-note { margin: 0 auto; max-width: 260px; font: italic 400 clamp(23px,2vw,30px)/1.2 'Cormorant Garamond',Georgia,serif; color: #e7d7d8; }
    .rule { height: 1px; width: 46px; margin: 26px auto; background: rgba(233,182,190,.6); }
    .exit-curtain { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:0; background:#050506; transition:opacity 1.8s ease; }
    .exit-curtain.closing { opacity:1; }
    @media (max-width: 1000px) { .gallery-inner { grid-template-columns: minmax(0,1fr) minmax(190px,.9fr) minmax(0,1.1fr); padding-left: 25px; padding-right: 25px; gap: 19px; } .gallery-title { font-size: clamp(45px,5vw,68px); } }
    @media (max-width: 700px) {
      .gallery-inner { width: 100%; display: flex; flex-direction: column; justify-content: center; padding: 53px 23px 58px; gap: 0; min-height: 100vh; min-height: 100dvh; }
      .center-copy { order: 0; margin-bottom: 22px; }
      .eyebrow { font-size: 9px; letter-spacing: .20em; }
      .gallery-title { font-size: clamp(47px,12vw,68px); margin: 13px 0 10px; }
      .gallery-note { font-size: 23px; max-width: 310px; }
      .rule { margin: 13px auto; }
      .gallery-photos { order: 1; display: flex; align-items: center; justify-content: center; width: 100%; gap: 4vw; padding: 20px 0; }
      .photo { padding: 6px 6px 19px; flex: 0 1 auto; }
      .photo-one { width: 41%; max-width: 240px; }
      .photo-two { width: 48%; max-width: 275px; }
      .photo figcaption { font-size: 15px; margin-top: 6px; }
      .gallery.active.revealed .photo-one { transform: translateY(17px) rotate(-5deg); }
      .gallery.active.revealed .photo-two { transform: translateY(-8px) rotate(4deg); }
    }
    @media (min-width: 701px) { .gallery-photos { display: contents; } }
    @media (max-height: 650px) and (min-width: 701px) { .gallery-inner { padding-top: 25px; padding-bottom: 25px; } .photo-one { max-width: min(29vw,245px); } .photo-two { max-width: min(34vw,275px); } }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .intro-lead, .intro-message, .intro-tagline, .photo, .center-copy { opacity: 1 !important; transform: none !important; }
    }
  </style>
  <script>
    // Only direct GitHub Pages visits are redirected; iframe chapters work normally.
    if (window.top === window.self && location.hostname.endsWith('.github.io')) {
      location.replace('./');
    }
  </script>
</head>
<body>
  <main class="experience">
    <section class="scene intro active" id="intro" aria-label="A little detour">
      <div class="intro-inner">
        <h1 class="intro-lead">Okay, okay…</h1>
        <p class="intro-message">We're not teleporting to today just yet.</p>
        <p class="intro-tagline">First, our little model deserves one more moment in the spotlight.</p>
      </div>
    </section>
    <section class="scene gallery" id="gallery" aria-label="Nadi, our little model" aria-hidden="true">
      <span class="bokeh one" aria-hidden="true"></span>
      <span class="bokeh two" aria-hidden="true"></span>
      <span class="bokeh three" aria-hidden="true"></span>
      <span class="bokeh four" aria-hidden="true"></span>
      <div class="gallery-inner">
        <div class="gallery-photos">
          <figure class="photo photo-one">
            <img src="assets/model-portrait.webp" alt="Nadi posing with her chin resting on her hands, in a soft pink sweater" decoding="async">
            <figcaption>Exhibit A: The innocent look</figcaption>
          </figure>
          <figure class="photo photo-two">
            <img src="assets/model-pink.webp" alt="Nadi winking with a lollipop, surrounded by pink balloons" decoding="async">
            <figcaption>Exhibit B: The troublemaker</figcaption>
          </figure>
        </div>
        <div class="center-copy">
          
          <h2 class="gallery-title">Born to <em>steal the spotlight.</em></h2>
          <div class="rule" aria-hidden="true"></div>
          <p class="gallery-note">And clearly, she knew it long before we did.</p>
        </div>
      </div>
    </section>
    <div class="exit-curtain" id="exitCurtain" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      const intro = document.getElementById('intro');
      const gallery = document.getElementById('gallery');
      const exitCurtain = document.getElementById('exitCurtain');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const params = new URLSearchParams(location.search);
      function showGallery() {
        gallery.classList.add('active');
        gallery.setAttribute('aria-hidden', 'false');
        intro.classList.remove('active');
        intro.setAttribute('aria-hidden', 'true');
        requestAnimationFrame(() => requestAnimationFrame(() => gallery.classList.add('revealed')));
        // After time to view both portraits, dissolve into the next chapter.
        if (params.get('scene') !== 'gallery') {
          setTimeout(() => {
            exitCurtain.classList.add('closing');
            window.parent.postMessage({nadiStory:true,action:'anticipate',page:'suspect.html'}, '*');
            setTimeout(() => window.location.assign('suspect.html'), reduced ? 120 : 1950);
          }, reduced ? 6500 : 12500);
        }
      }
      if (params.get('scene') === 'gallery') {
        showGallery();
      } else {
        requestAnimationFrame(() => requestAnimationFrame(() => intro.classList.add('revealed')));
        setTimeout(showGallery, reduced ? 1800 : 6900);
      }
    })();
  </script>
  <script>
    // Music controls stay in index.html, so the soundtrack can survive chapter changes.
    (() => {
      if (window.parent === window) return;
      const send = (action, extra={}) => {
        try { window.parent.postMessage({nadiStory:true, action, ...extra}, '*'); } catch (_) {}
      };
      const page = location.pathname.split('/').pop();
      send('ready', {page});
      document.addEventListener('click', e => {
        if (e.target.closest('#openEnvelope, #tapLabel')) send('open-letter');
      }, true);
      for (const action of ['play','pause','ended','volumechange']) {
        document.addEventListener(action, e => {
          if (e.target.tagName === 'VIDEO') {
            const v = e.target;
            send('video', {event:action, videoId:v.id, audible:!v.muted && v.volume>0});
          }
        }, true);
      }
    })();
  </script>
</body>
</html>
