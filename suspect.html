<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060609">
  <meta name="description" content="The very suspicious case of Nadi.">
  <title>The Nadi File</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --night:#070709; --cream:#f5ebdf; --red:#b75d65; --paper:#f1ede6; --ease:cubic-bezier(.22,1,.36,1); }
    *,*::before,*::after { box-sizing:border-box; }
    html { height:100%; background:var(--night); }
    body { min-height:100vh; min-height:100dvh; margin:0; overflow-x:hidden; color:var(--cream); font-family:'DM Sans',sans-serif; background:var(--night); }
    .experience { min-height:100vh; min-height:100dvh; position:relative; isolation:isolate; overflow:hidden; }
    .scene { position:absolute; inset:0; min-height:100vh; min-height:100dvh; visibility:hidden; opacity:0; pointer-events:none; transition:opacity 1.7s ease,visibility 1.7s; }
    .scene.active { visibility:visible; opacity:1; pointer-events:auto; }
    .intro { display:grid; place-items:center; padding:32px 20px; text-align:center; background:#050507; }
    .intro::before { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center,rgba(120,52,68,.12),transparent 65%); }
    .intro-copy { position:relative; z-index:1; max-width:1040px; }
    .intro-copy p { margin:0; text-wrap:balance; opacity:0; transform:translateY(25px); transition:opacity 1.25s ease,transform 1.45s var(--ease); }
    .intro-first { color:var(--cream); font:italic 500 clamp(41px,6.9vw,83px)/1.06 'Cormorant Garamond',Georgia,serif; letter-spacing:-.025em; }
    .intro-second { color:#c4a8a6; font:italic 400 clamp(23px,3.5vw,39px)/1.2 'Cormorant Garamond',Georgia,serif; margin-top:30px!important; }
    .intro-third { color:#e8a0a0; font:italic 500 clamp(38px,5.3vw,69px)/1.1 'Cormorant Garamond',Georgia,serif; margin-top:22px!important; }
    .intro.active.revealed .intro-first { opacity:1; transform:none; }
    .intro.active.revealed .intro-second { opacity:1; transform:none; transition-delay:1.4s; }
    .intro.active.revealed .intro-third { opacity:1; transform:none; transition-delay:3.1s; }

    .evidence { overflow:auto; background:#0a080a; }
    .wall { position:absolute; inset:-12%; background-image:url('assets/nadi-lineup.webp'); background-repeat:repeat; background-size:250px auto; background-position:top left; opacity:.0; filter:grayscale(1) contrast(1.22) brightness(.50); transform:rotate(-4deg) scale(1.08); transition:opacity 2.2s ease; animation:creep 35s linear infinite alternate; }
    .evidence.active .wall { opacity:.45; }
    .wall.second { background-size:340px auto; background-position:130px 75px; transform:rotate(3deg) scale(1.09); opacity:0; filter:grayscale(1) sepia(.30) hue-rotate(302deg) brightness(.31) contrast(1.48); animation-duration:48s; }
    .evidence.active .wall.second { opacity:.27; }
    .evidence::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,rgba(5,4,7,.92) 0%,rgba(6,5,8,.74) 36%,rgba(6,5,8,.47) 69%,rgba(6,5,8,.77) 100%),radial-gradient(ellipse at 60% 50%,transparent 20%,rgba(0,0,0,.76) 92%); pointer-events:none; }
    .evidence-grain { position:absolute; inset:0; z-index:4; opacity:.25; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.77' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.29'/%3E%3C/svg%3E"); }
    .frame-lines { position:absolute; inset:22px; border:1px solid rgba(243,224,214,.12); z-index:3; pointer-events:none; }
    .evidence-content { position:relative; z-index:5; display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,.9fr); align-items:center; gap:clamp(30px,7vw,105px); max-width:1320px; min-height:100vh; min-height:100dvh; padding:clamp(55px,7vh,96px) clamp(35px,8vw,115px); margin:auto; }
    .copy { opacity:0; transform:translateY(30px); transition:opacity 1.4s .5s ease,transform 1.6s .5s var(--ease); }
    .evidence.active.revealed .copy { opacity:1; transform:none; }
    .file-number { display:flex; align-items:center; gap:15px; font:500 clamp(10px,1vw,12px)/1.5 'DM Sans',sans-serif; color:#d9a8a8; text-transform:uppercase; letter-spacing:.32em; }
    .file-number::before { content:''; width:31px; height:1px; background:var(--red); }
    h1 { font:italic 500 clamp(65px,7.4vw,108px)/.93 'Cormorant Garamond',Georgia,serif; letter-spacing:-.045em; margin:30px 0 23px; text-wrap:balance; color:#fff4ec; text-shadow:0 5px 28px rgba(0,0,0,.35); }
    h1 em { font-weight:500; color:#e4a7ac; }
    .case-text { font:italic 500 clamp(23px,2.45vw,33px)/1.23 'Cormorant Garamond',Georgia,serif; color:#e2cdcb; margin:0; max-width:510px; }
    .divider { width:48px; height:1px; background:#ce9396; margin:31px 0; }
    .charge-label { color:#bd9d9d; font-size:10px; letter-spacing:.29em; font-weight:600; margin:0 0 8px; }
    .charge { margin:0; font:italic 500 clamp(24px,2.8vw,36px)/1.17 'Cormorant Garamond',Georgia,serif; color:#fff0e8; }
    .charge b { font-weight:600; color:#efa5a9; }
    .evidence-photo { position:relative; width:min(100%,420px); justify-self:center; transform:translate(50px,40px) rotate(7deg) scale(.9); opacity:0; transition:transform 2.0s 1.05s var(--ease),opacity 1.5s 1.05s ease; filter:drop-shadow(0 30px 40px rgba(0,0,0,.64)); }
    .evidence.active.revealed .evidence-photo { transform:translate(0,0) rotate(3deg) scale(1); opacity:1; }
    .photocard { padding:11px 11px 42px; background:linear-gradient(160deg,#fcfaf3 0%,#e7e0d6 100%); box-shadow:inset 0 0 0 1px rgba(99,73,66,.20),0 25px 55px rgba(0,0,0,.5); position:relative; }
    .photocard::after { content:''; position:absolute; inset:11px 11px 42px; border:1px solid rgba(0,0,0,.10); pointer-events:none; }
    .photocard img { width:100%; height:auto; display:block; filter:saturate(.72) contrast(1.07); }
    .photo-stamp { position:absolute; right:-31px; bottom:31px; border:4px double rgba(156,45,55,.88); border-radius:4px; color:#b55562; padding:8px 12px 6px; background:rgba(247,231,220,.82); font:700 clamp(16px,2vw,24px)/1 'DM Sans',sans-serif; letter-spacing:.10em; transform:rotate(-17deg); white-space:nowrap; box-shadow:0 3px 15px rgba(0,0,0,.15); }
    .photocard-caption { position:absolute; bottom:13px; left:19px; color:#796e69; font:italic 500 17px/1.1 'Cormorant Garamond',Georgia,serif; }
    .photo-corner { position:absolute; width:18px; height:18px; border:1px solid rgba(253,221,212,.5); opacity:.7; z-index:2; }
    .photo-corner.a { top:-18px; left:-18px; border-right:0; border-bottom:0; }
    .photo-corner.b { top:-18px; right:-18px; border-left:0; border-bottom:0; }
    .photo-corner.c { bottom:-18px; left:-18px; border-right:0; border-top:0; }
    .photo-corner.d { bottom:-18px; right:-18px; border-left:0; border-top:0; }
    .scan-beam { position:absolute; z-index:2; top:0; bottom:0; left:-20%; width:22%; background:linear-gradient(90deg,transparent,rgba(244,200,190,.16),transparent); transform:skewX(-15deg); pointer-events:none; animation:scan 10s 3s ease-in-out infinite; }
    .soft-flash { position:absolute; z-index:7; inset:0; background:#f4e8df; pointer-events:none; opacity:0; }
    .evidence.active .soft-flash { animation:photo-flash 1.0s 1.4s ease-out both; }
    .exit-curtain { position:fixed; z-index:99; inset:0; background:#050507; pointer-events:none; opacity:0; transition:opacity 1.8s ease; }
    .exit-curtain.closing { opacity:1; }
    @keyframes photo-flash { 0%,35% { opacity:0; } 42% { opacity:.42; } 100% { opacity:0; } }
    @keyframes creep { from { background-position:0 0; } to { background-position:90px -95px; } }
    @keyframes scan { 0%,13% { left:-30%; opacity:0; } 16% { opacity:1; } 52% { left:120%; opacity:0; } 100% { left:120%; opacity:0; } }
    @media (max-width:800px) {
      .evidence-content { grid-template-columns:1fr; gap:29px; padding:55px 32px 72px; text-align:center; align-content:center; }
      .copy { order:0; }
      .evidence-photo { order:1; width:min(61%,350px); }
      .file-number { justify-content:center; }
      h1 { font-size:clamp(50px,10vw,72px); margin:19px 0 15px; }
      .case-text { margin:auto; font-size:clamp(22px,4.1vw,27px); }
      .divider { margin:20px auto; }
      .charge { font-size:clamp(23px,4.4vw,31px); }
      .photocard { padding:8px 8px 29px; }
      .photocard::after { inset:8px 8px 29px; }
      .photocard-caption { bottom:8px; font-size:12px; left:13px; }
      .photo-stamp { font-size:14px; right:-20px; bottom:25px; border-width:3px; }
      .wall { background-size:165px auto; }
      .wall.second { background-size:230px auto; }
    }
    @media (max-width:500px) {
      .evidence-content { padding:55px 24px 65px; gap:17px; }
      .frame-lines { inset:10px; }
      .file-number { font-size:9px; }
      h1 { font-size:clamp(47px,13vw,65px); margin:13px 0; }
      .case-text { font-size:22px; line-height:1.12; }
      .divider { margin:14px auto; }
      .charge-label { font-size:8px; }
      .charge { font-size:23px; }
      .evidence-photo { width:min(66%,240px); }
      .intro-first { font-size:clamp(40px,11vw,60px); }
      .intro-second { font-size:clamp(24px,6vw,33px); }
      .intro-third { font-size:clamp(42px,11vw,61px); }
    }
    @media (max-height:640px) and (min-width:801px) { .evidence-content { padding-top:20px; padding-bottom:20px; } .evidence-photo { width:min(32vw,310px); } h1 { font-size:65px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } .intro-copy p,.copy,.evidence-photo { opacity:1!important; transform:none!important; } }
  </style>
  <script>
    // Only direct GitHub Pages visits are redirected; iframe chapters work normally.
    if (window.top === window.self && location.hostname.endsWith('.github.io')) {
      location.replace('./');
    }
  </script>
</head>
<body>
  <main class="experience">
    <section class="scene intro active" id="intro" aria-label="A suspicious revelation">
      <div class="intro-copy">
        <p class="intro-first">But don't let that innocent face fool you</p>
        <p class="intro-second">Our little model had been leading a double life…</p>
        <p class="intro-third">As a full-time criminal</p>
      </div>
    </section>
    <section class="scene evidence" id="evidence" aria-label="The Nadi case file" aria-hidden="true">
      <div class="wall" aria-hidden="true"></div>
      <div class="wall second" aria-hidden="true"></div>
      <div class="frame-lines" aria-hidden="true"></div>
      <div class="scan-beam" aria-hidden="true"></div>
      <div class="evidence-grain" aria-hidden="true"></div>
      <div class="evidence-content">
        <div class="copy">
          <p class="file-number">Case file 001 · Strictly confidential</p>
          <h1>The <em>Nadi</em> File.</h1>
          <p class="case-text"><br>Absolutely no sign of remorse.</p>
          <div class="divider" aria-hidden="true"></div>
          <p class="charge-label">THE CHARGE</p>
          <p class="charge">Stealing hearts.<br><b>Repeatedly.</b></p>
        </div>
        <figure class="evidence-photo">
          <span class="photo-corner a" aria-hidden="true"></span>
          <span class="photo-corner b" aria-hidden="true"></span>
          <span class="photo-corner c" aria-hidden="true"></span>
          <span class="photo-corner d" aria-hidden="true"></span>
          <div class="photocard">
            <img src="assets/nadi-lineup.webp" alt="Four portraits of Nadi arranged like a playful identification photograph" loading="eager">
            <span class="photocard-caption">Evidence no. 001</span>
          </div>
          <span class="photo-stamp" aria-hidden="true">WANTED</span>
        </figure>
      </div>
      <div class="soft-flash" aria-hidden="true"></div>
    </section>
    <div class="exit-curtain" id="exitCurtain" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      const intro = document.getElementById('intro');
      const evidence = document.getElementById('evidence');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const sceneParam = new URLSearchParams(location.search).get('scene');
      const exitCurtain = document.getElementById('exitCurtain');
      function showEvidence() {
        evidence.classList.add('active');
        evidence.setAttribute('aria-hidden','false');
        intro.classList.remove('active');
        intro.setAttribute('aria-hidden','true');
        requestAnimationFrame(() => requestAnimationFrame(() => evidence.classList.add('revealed')));
        if (sceneParam !== 'evidence') {
          setTimeout(() => {
            exitCurtain.classList.add('closing');
            window.parent.postMessage({nadiStory:true,action:'anticipate',page:'cycle.html'}, '*');
            setTimeout(() => window.location.assign('cycle.html'), reduced ? 100 : 1870);
          }, reduced ? 4200 : 11500);
        }
      }
      if (sceneParam === 'evidence') {
        showEvidence();
      } else {
        requestAnimationFrame(() => requestAnimationFrame(() => intro.classList.add('revealed')));
        setTimeout(showEvidence, reduced ? 1700 : 6850);
      }
    })();
  </script>
  <script>
    // Music controls stay in index.html, so the soundtrack can survive chapter changes.
    (() => {
      if (window.parent === window) return;
      const send = (action, extra={}) => {
        try { window.parent.postMessage({nadiStory:true, action, ...extra}, '*'); } catch (_) {}
      };
      const page = location.pathname.split('/').pop();
      send('ready', {page});
      document.addEventListener('click', e => {
        if (e.target.closest('#openEnvelope, #tapLabel')) send('open-letter');
      }, true);
      for (const action of ['play','pause','ended','volumechange']) {
        document.addEventListener(action, e => {
          if (e.target.tagName === 'VIDEO') {
            const v = e.target;
            send('video', {event:action, videoId:v.id, audible:!v.muted && v.volume>0});
          }
        }, true);
      }
    })();
  </script>
</body>
</html>
